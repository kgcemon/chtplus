name: cht_plus
description: "CHT Plus — local services, blood donors, marketplace, matrimony and doctor appointments for Khagrachari, Rangamati and Bandarban."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # Platform helpers
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0

  # Rendering + formatting
  flutter_widget_from_html_core: ^0.17.4
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Sign-in + push
  google_sign_in: ^7.1.1
  onesignal_flutter: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
